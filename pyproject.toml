[project]
name = "hospital-rl"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "networkx",
  "torch",
  "gymnasium",
  "pettingzoo",
  "pydantic>=2",
  "pyyaml",
  "fastapi",
  "uvicorn",
]

[project.optional-dependencies]
dev = ["pytest", "httpx", "onnx", "onnxruntime"]
cloud = ["modal", "daytona==0.225.0"]
inference = ["onnx", "onnxruntime"]
native = ["cmake", "pybind11"]

[project.scripts]
hospital-rl = "hospital_rl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hospital_rl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: real-environment smoke tests"]
